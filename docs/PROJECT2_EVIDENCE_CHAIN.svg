<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">Project 2 causal evidence chain</title><desc id="desc">Remote inference works, frozen transfer fails, controls isolate the limitation, and the project stops at an instrumentation validity gate.</desc>
  <style>.box{stroke:#1e3a5f;stroke-width:2;rx:12}.t{font:600 16px Arial;fill:#102a43}.s{font:13px Arial;fill:#334e68}.arrow{stroke:#627d98;stroke-width:2;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#627d98"/></marker></defs>
  <rect x="25" y="35" width="190" height="100" class="box" fill="#e6f6ff"/><text x="120" y="68" text-anchor="middle" class="t">Remote inference</text><text x="120" y="94" text-anchor="middle" class="s">typed request · deadline</text><text x="120" y="113" text-anchor="middle" class="s">safe hold · action chunk</text>
  <rect x="270" y="35" width="190" height="100" class="box" fill="#fff1f0"/><text x="365" y="68" text-anchor="middle" class="t">Zero-shot reach</text><text x="365" y="94" text-anchor="middle" class="s">5 reachable targets</text><text x="365" y="113" text-anchor="middle" class="s">0 / 5 success</text>
  <rect x="515" y="35" width="190" height="100" class="box" fill="#fff7e6"/><text x="610" y="68" text-anchor="middle" class="t">Residual diagnosis</text><text x="610" y="94" text-anchor="middle" class="s">weak one-step signal</text><text x="610" y="113" text-anchor="middle" class="s">adapters: 0 / 24</text>
  <rect x="760" y="35" width="190" height="100" class="box" fill="#e9f8ef"/><text x="855" y="68" text-anchor="middle" class="t">Controller isolation</text><text x="855" y="94" text-anchor="middle" class="s">analytic DLS contract</text><text x="855" y="113" text-anchor="middle" class="s">independent final: 4 / 4</text>
  <rect x="1005" y="35" width="170" height="100" class="box" fill="#fff1f0"/><text x="1090" y="68" text-anchor="middle" class="t">Intent probes</text><text x="1090" y="94" text-anchor="middle" class="s">state/action controls</text><text x="1090" y="113" text-anchor="middle" class="s">incremental gate fails</text>
  <path d="M215 85H270M460 85H515M705 85H760M950 85H1005" class="arrow"/>
  <rect x="300" y="225" width="280" height="100" class="box" fill="#f4f0ff"/><text x="440" y="258" text-anchor="middle" class="t">Counterfactual benchmark</text><text x="440" y="284" text-anchor="middle" class="s">same state · ±X/±Y/±Z</text><text x="440" y="303" text-anchor="middle" class="s">480 requests · gate fails</text>
  <rect x="665" y="225" width="280" height="100" class="box" fill="#fff1f0"/><text x="805" y="258" text-anchor="middle" class="t">Instrumentation stop rule</text><text x="805" y="284" text-anchor="middle" class="s">action equivalence invalid</text><text x="805" y="303" text-anchor="middle" class="s">freeze Project 2 research</text>
  <path d="M1090 135V175H440V225" class="arrow"/><path d="M580 275H665" class="arrow"/>
</svg>
